<div class="page-header">
  <div>
    <h2 class="text-2xl">Organization</h2>
    <p class="desc">Manage your company profile and business details.</p>
  </div>
  <div class="page-actions">
    <button class="btn btn-primary">Save Changes</button>
  </div>
</div>

<div style="display:grid; grid-template-columns:1fr 2fr; gap:20px; align-items:start;">
  <!-- Left Column -->
  <div class="card card-pad" style="text-align:center;">
    <div class="avatar" style="width:84px; height:84px; font-size:26px; margin:0 auto 14px; background:var(--primary-light); color:var(--primary); display:flex; align-items:center; justify-content:center; border-radius:50%;">
      ABC
    </div>
    <button class="btn btn-secondary btn-sm btn-block">Upload Logo</button>
    <div class="divider"></div>
    <div class="text-sm fw-600">ABC Automation Pvt Ltd</div>
    <span class="chip chip-active" style="margin-top:8px;">Active</span>
  </div>

  <!-- Right Column -->
  <div class="card card-pad">
    <h3 style="margin-bottom:16px;">Company Details</h3>
    <div class="form-grid">
      <div class="form-group"><label class="form-label">Company Name</label><input class="form-control" value="ABC Automation Pvt Ltd"></div>
      <div class="form-group"><label class="form-label">Company Type</label><input class="form-control" value="Client" disabled></div>
      <div class="form-group"><label class="form-label">GST Number</label><input class="form-control" value="27AAFCA1234B1Z5"></div>
      <div class="form-group"><label class="form-label">Contact Person</label><input class="form-control" value="Rahul Sharma"></div>
      <div class="form-group full"><label class="form-label">Address</label><input class="form-control" value="Plot 42, MIDC Industrial Area, Bhosari"></div>
      <div class="form-group"><label class="form-label">City</label><input class="form-control" value="Pune"></div>
      <div class="form-group"><label class="form-label">State</label><input class="form-control" value="Maharashtra"></div>
    </div>
  </div>
</div>
