<div class="page-header">
  <div>
    <h2 class="text-2xl">Profile</h2>
    <p class="desc">Your personal account settings.</p>
  </div>
</div>

<div style="display:grid; grid-template-columns:1fr 2fr; gap:20px; align-items:start;">
  <!-- Left Column -->
  <div class="card card-pad" style="text-align:center;">
    <div class="avatar" style="width:84px; height:84px; font-size:26px; margin:0 auto 14px; background:var(--primary-light); color:var(--primary); display:flex; align-items:center; justify-content:center; border-radius:50%;">
      RS
    </div>
    <div class="text-sm fw-600">Rahul Sharma</div>
    <div class="text-xs text-muted">Purchase Manager · ABC Automation Pvt Ltd</div>
  </div>

  <!-- Right Column -->
  <div class="card card-pad">
    <h3 style="margin-bottom:16px;">Personal Information</h3>
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">First Name</label>
        <input class="form-control" value="Rahul">
      </div>
      <div class="form-group">
        <label class="form-label">Last Name</label>
        <input class="form-control" value="Sharma">
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-control" value="rahul.sharma@abcautomation.in">
      </div>
      <div class="form-group">
        <label class="form-label">Designation</label>
        <input class="form-control" value="Purchase Manager">
      </div>
    </div>
    
    <div class="divider"></div>
    
    <h3 style="margin-bottom:16px;">Change Password</h3>
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">New Password</label>
        <input type="password" class="form-control" placeholder="••••••••">
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input type="password" class="form-control" placeholder="••••••••">
      </div>
    </div>
    
    <button class="btn btn-primary" style="margin-top:16px;">Update Profile</button>
  </div>
</div>
